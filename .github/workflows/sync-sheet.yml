# Runs the Google Sheet sync on GitHub's servers on a schedule, so no laptop/Colab has to stay on.
# Setup: repo Settings -> Secrets and variables -> Actions -> New repository secret:
#   SHEET_ID         = the id in the sheet URL (between /d/ and /edit)
#   GCP_SA_JSON      = the full content of service_account.json
# Optional secret FORM_TAB = name of the form-responses tab (leave unset to use the first tab).
name: sync-sheet

on:
  schedule:
    # Every 15 min, 07:00-19:00 WIB (00:00-12:00 UTC), Mon-Sat. Free private repos get ~2000 Actions minutes/month;
    # this uses ~1250. For 24/7 or faster runs use a public repo (unlimited minutes) or a paid plan.
    - cron: "*/15 0-12 * * 1-6"
  workflow_dispatch:   # lets you press "Run workflow" manually

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - run: pip install -r requirements-sync.txt
      - name: Sync new applicants to the sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          FORM_TAB: ${{ secrets.FORM_TAB }}
        run: |
          printf '%s' "$GCP_SA_JSON" > "$RUNNER_TEMP/sa.json"
          if [ -n "$FORM_TAB" ]; then
            python sheet_sync.py --sheet-id "$SHEET_ID" --creds "$RUNNER_TEMP/sa.json" --form-tab "$FORM_TAB"
          else
            python sheet_sync.py --sheet-id "$SHEET_ID" --creds "$RUNNER_TEMP/sa.json"
          fi
          rm -f "$RUNNER_TEMP/sa.json"
